<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>あいさつ（HTML）</title>
  <script type="text/javascript">
    // フォームの値の読み書き（Get / Set Form Values から呼ばれる）。sendMessage は実行時にエンジンが差し替える
    var uiPathApi = {
      getValue: function (id) { var el = document.getElementById(id); return el.value === undefined ? el.innerHTML : el.value; },
      setValue: function (id, value) { var el = document.getElementById(id); if (el.value === undefined) el.innerHTML = value; else el.value = value; },
      sendMessage: function (id, value) { }
    };
  </script>
</head>
<body>
  <p>名前：<input id="name" type="text"></p>
  <button onclick="uiPathApi.sendMessage('ok', document.getElementById('name').value)">OK</button>
</body>
</html>
